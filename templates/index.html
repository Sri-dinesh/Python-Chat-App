<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Chat App</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"
      integrity="sha512-luMnTJZ7oEchNDZAtQhgjomP1eZefnl82ruTH/3Oj/Yu5qYtwL7+dVRccACS/Snp1lFXq188XFipHKYE75IaQQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <style>
      :root {
        /* --primary-color: #4a90e2; */
        --primary-color: hsla(217 100% 56% / 1);
        --primary-light: #5da8ff;
        --primary-dark: #3a7cbd;
        --secondary-color: #e8f1f8;
        --text-color: #2c3e50;
        /* --bg-color: #f0f8ff; */
        --bg-color: #edf2f4;
        --message-bg: #e1eeff;
        --system-message-color: #8fa4b8;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      .chat-container {
        max-width: 800px;
        width: 95%;
        margin: 20px auto;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 90vh;
      }

      .chat-header {
        background-color: var(--primary-color);
        color: white;
        padding: 15px;
        text-align: center;
        font-size: clamp(18px, 4vw, 24px);
        font-weight: bold;
      }

      .chat-messages {
        flex-grow: 1;
        overflow-y: auto;
        padding: 20px;
        background-color: var(--secondary-color);
        scrollbar-width: thin;
        scrollbar-color: var(--primary-color) var(--secondary-color);
      }

      .chat-messages::-webkit-scrollbar {
        width: 8px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: var(--secondary-color);
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background-color: var(--primary-color);
        border-radius: 4px;
      }

      .message {
        margin-bottom: 15px;
        display: flex;
        align-items: flex-start;
        animation: fadeIn 0.3s ease-in;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .message img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin-right: 10px;
        border: 2px solid var(--primary-color);
      }

      .message-content {
        background-color: var(--message-bg);
        padding: 12px;
        border-radius: 18px;
        max-width: 70%;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .message-username {
        font-weight: bold;
        margin-bottom: 5px;
        color: var(--primary-dark);
      }

      .chat-input {
        display: flex;
        padding: 15px;
        background-color: white;
        border-top: 1px solid var(--secondary-color);
        gap: 10px;
      }

      #message-input,
      #username-input {
        flex-grow: 1;
        padding: 12px 20px;
        border: 2px solid var(--secondary-color);
        border-radius: 25px;
        transition: border-color 0.3s ease;
        margin-right: 10px;
        font-size: 16px;
      }

      #send-button,
      #update-username-button {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
      }

      #send-button:hover,
      #update-username-button:hover {
        background-color: var(--primary-dark);
      }

      .username-container {
        display: flex;
        padding: 15px 20px;
        background-color: var(--secondary-color);
        align-items: center;
      }

      #current-username {
        margin-right: 10px;
        font-weight: bold;
        color: var(--primary-dark);
      }

      .system-message {
        text-align: center;
        font-style: italic;
        color: var(--system-message-color);
        margin: 10px 0;
      }

      .message.sent {
        flex-direction: row-reverse;
      }

      .message.sent .message-content {
        background-color: var(--primary-color);
        color: white;
        margin-left: 10px;
        margin-right: 0;
      }

      .message.sent .message-username {
        text-align: right;
        color: white;
      }

      .message.sent img {
        margin-right: 0;
        margin-left: 10px;
      }

      button {
        padding: 1.3em 3em;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        font-weight: 500;
        color: #000;
        background-color: #fff;
        border: none;
        border-radius: 45px;
        box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease 0s;
        cursor: pointer;
        outline: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      button:hover {
        background-color: #23c483;
        box-shadow: 0px 15px 20px rgba(46, 229, 157, 0.4);
        color: #fff;
        transform: translateY(-7px);
      }

      button:active {
        transform: translateY(-1px);
      }

      button span {
        display: block;
        margin-left: 0.4em;
      }

      button svg {
        width: 18px;
        height: 18px;
        transition: all 0.3s;
      }

      button:hover svg {
        fill: #fff;
      }

      button .svg-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.2);
        margin-right: 0.5em;
        transition: all 0.3s;
      }

      button:hover .svg-wrapper {
        background-color: rgba(255, 255, 255, 0.5);
      }

      button:hover svg {
        transform: rotate(45deg);
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: linear;
        }
      }

      /* Mobile Responsive Design */
      @media screen and (max-width: 768px) {
        .chat-container {
          width: 100%;
          margin: 0;
          height: 100vh;
          border-radius: 0;
        }

        .chat-header {
          padding: 10px;
        }

        .chat-input {
          padding: 10px;
        }

        .message-content {
          max-width: 85%;
        }

        .username-container {
          flex-wrap: wrap;
          gap: 10px;
        }

        #username-input {
          width: 100%;
          order: 2;
        }

        .btn-donate {
          width: 100%;
          order: 3;
        }

        #current-username {
          width: 100%;
          order: 1;
          text-align: center;
        }

        .message img {
          width: 32px;
          height: 32px;
        }
      }

      /* Input Focus Styles */
      #message-input:focus,
      #username-input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
      }

      /* Prevent text from overflowing */
      .message-content {
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">Simple Python Chat App</div>
      <div class="username-container">
        <span id="current-username"></span>
        <input
          type="text"
          id="username-input"
          placeholder="Enter your New username"
        />
        <button class="update-username-button">
          Update Username
        </button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input">
        <input
          type="text"
          id="message-input"
          placeholder="Type your message..."
        />
        <!-- <button id="send-button">Send</button> -->
        <button class="send-button">
          <div class="svg-wrapper-1">
            <div class="svg-wrapper">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="24"
                height="24"
              >
                <path fill="none" d="M0 0h24v24H0z"></path>
                <path
                  fill="currentColor"
                  d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z"
                ></path>
              </svg>
            </div>
          </div>
          <span>Send</span>
        </button>
      </div>
    </div>

    <script>
      const socket = io();
      const chatMessages = document.getElementById("chat-messages");
      const messageInput = document.getElementById("message-input");
      const sendButton = document.querySelector(".send-button");
      const currentUsernameSpan = document.getElementById("current-username");
      const usernameInput = document.getElementById("username-input");
      const updateUsernameButton = document.querySelector(".update-username-button");

      let currentUsername = localStorage.getItem('username') || "";
      const MAX_STORED_MESSAGES = 50;
      
      // Load stored messages
      const loadStoredMessages = () => {
        const messages = JSON.parse(localStorage.getItem('messages') || '[]');
        messages.forEach(msg => {
          if (msg.type === 'user') {
            addMessage(msg.message, 'user', msg.username, msg.avatar);
          } else {
            addMessage(msg.message, 'system');
          }
        });
      };

      // Store message in localStorage
      const storeMessage = (message, type, username = "", avatar = "") => {
        const messages = JSON.parse(localStorage.getItem('messages') || '[]');
        messages.push({ message, type, username, avatar, timestamp: Date.now() });
        
        // Keep only the last MAX_STORED_MESSAGES messages
        if (messages.length > MAX_STORED_MESSAGES) {
          messages.splice(0, messages.length - MAX_STORED_MESSAGES);
        }
        
        localStorage.setItem('messages', JSON.stringify(messages));
      };

      // Load stored messages on startup
      loadStoredMessages();

      socket.on("set_username", (data) => {
        currentUsername = data.username;
        localStorage.setItem('username', currentUsername);
        currentUsernameSpan.textContent = `Your username: ${currentUsername}`;
      });

      socket.on("user_joined", (data) => {
        const message = `${data.username} joined the chat`;
        addMessage(message, "system");
        storeMessage(message, "system");
      });

      socket.on("user_left", (data) => {
        addMessage(`${data.username} left the chat`, "system");
      });

      socket.on("new_message", (data) => {
        addMessage(data.message, "user", data.username, data.avatarUrl);
        storeMessage(data.message, "user", data.username, data.avatarUrl);
      });

      socket.on("username_updated", (data) => {
        const message = `${data.old_username} changed their name to ${data.new_username}`;
        addMessage(message, "system");
        storeMessage(message, "system");
        
        if (data.old_username === currentUsername) {
          currentUsername = data.new_username;
          localStorage.setItem('username', currentUsername);
          currentUsernameSpan.textContent = `Your username: ${currentUsername}`;
        }
      });

      sendButton.addEventListener("click", sendMessage);
      messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      updateUsernameButton.addEventListener("click", updateUsername);

      function sendMessage() {
        const message = messageInput.value.trim();
        if (message) {
          socket.emit("send_message", { message });
          messageInput.value = "";
        }
      }

      function updateUsername() {
        const newUsername = usernameInput.value.trim();
        if (newUsername && newUsername !== currentUsername) {
          socket.emit("update_username", { username: newUsername });
          usernameInput.value = "";
        }
      }

      function addMessage(message, type, username = "", avatar = "") {
        const messageElement = document.createElement("div");
        messageElement.className = "message";

        if (type === "user") {
          const isSentMessage = username === currentUsername;
          if (isSentMessage) {
            messageElement.classList.add("sent");
          }

          const avatarImg = document.createElement("img");
          avatarImg.src = avatar;
          messageElement.appendChild(avatarImg);

          const contentDiv = document.createElement("div");
          contentDiv.className = "message-content";

          const usernameDiv = document.createElement("div");
          usernameDiv.className = "message-username";
          usernameDiv.textContent = username;
          contentDiv.appendChild(usernameDiv);

          const messageText = document.createElement("div");
          messageText.textContent = message;
          contentDiv.appendChild(messageText);

          messageElement.appendChild(contentDiv);
        } else {
          messageElement.className = "system-message";
          messageElement.textContent = message;
        }
        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    </script>
  </body>
</html>
